env:
  XLA_REACTANT_GPU_PREALLOCATE: false
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
  JULIA_NUM_PRECOMPILE_TASKS: 4
  JULIA_NUM_THREADS: 4

# Path groups for `if_changed`
paths:
  buildkite:     &buildkite_paths      ".buildkite/{pipeline-juliagpu.yml,hooks/**}"
  code:          &code_paths           "{ext,src}/**"
  project:       &project_paths        "Project.toml"
  tests:         &test_paths           "test/{Project.toml,runtests.jl,init/**,setup/**}"

steps:
  - label: "🦕 AMDGPU extension tests - Julia {{matrix.version}}"
    skip: "Disabled"
    matrix:
      setup:
        version:
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      # - JuliaCI/julia-coverage#v1:
      #     codecov: true
    if_changed:
      include: [*buildkite_paths, *code_paths, *project_paths, *test_paths, "test/amdgpu/**"]
    command: |
      TEST_GROUP=init julia --project -O0 --color=yes -e 'using Pkg; Pkg.test(; test_args=["--verbose"])'

      TEST_GROUP=amdgpu julia --project -O0 --color=yes -e 'using Pkg; Pkg.test(; test_args=["--verbose"])'
    agents:
      queue: "rocm"
    timeout_in_minutes: 30
    soft_fail:
      - exit_status: 3


  - label: "🦖 oneAPI extension tests - Julia {{matrix.version}}"
    skip: "Disabled"
    matrix:
      setup:
        version:
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      # - JuliaCI/julia-coverage#v1:
      #     codecov: true
    if_changed:
      include: [*buildkite_paths, *code_paths, *project_paths, *test_paths, "test/oneapi/**"]
    command: |
      TEST_GROUP=init julia --project -O0 --color=yes -e 'using Pkg; Pkg.test(; test_args=["--verbose"])'

      TEST_GROUP=oneapi julia --project -O0 --color=yes -e 'using Pkg; Pkg.test(; test_args=["--verbose"])'
    agents:
      queue: "oneapi"
    timeout_in_minutes: 30
    soft_fail:
      - exit_status: 3
