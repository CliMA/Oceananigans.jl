env:
  JULIA_VERSION: "1.12.4"
  JULIA_VERSION_ENZYME: "1.11.9"
  BUILDKITE_HOME: "/var/lib/buildkite-agent"
  JULIA_DEPOT_PATH: "$BUILDKITE_HOME/.julia:"
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
  XLA_REACTANT_GPU_PREALLOCATE: false
  OCEANANIGANS_DIR: "$HOME/Oceananigans.jl-$BUILDKITE_BUILD_NUMBER"
  JULIA_CUDA_USE_COMPAT: false
agents:
  queue: "Oceananigans"
with:
  coverage: false

steps:
  - label: "🏕️ initialize general environment"
    key: "init"
    agents:
      queue: "Oceananigans-nautilus"
    env:
      TEST_GROUP: "init"
    command: |
      juliaup add $JULIA_VERSION

      mkdir -p "$OCEANANIGANS_DIR"
      rsync -a . "$OCEANANIGANS_DIR/"
      cd "$OCEANANIGANS_DIR"

      # On Nautilus we have old GPUs which require CUDA toolkit v12, can't
      # use v13.
      echo -e '[CUDA_Runtime_jll]\nversion = "12.9"' > test/LocalPreferences.toml

      julia +$JULIA_VERSION -O0 --color=yes --project -e 'using Pkg; Pkg.test()'
      # After we have instantiated the general environment, move manifest to the
      # version-specific filename, not to clash with the manifest for Enzyme.
      mv -v Manifest.toml Manifest-v$(echo "${JULIA_VERSION}" | cut -d. -f1-2).toml
    retry:
      automatic:
        - exit_status: 1
          limit: 1

  - label: "🏕️ initialize enzyme environment"
    key: "init_enzyme"
    depends_on: "init"
    agents:
      queue: "Oceananigans-nautilus"
    env:
      TEST_GROUP: "init"
    command: |
      juliaup add $JULIA_VERSION_ENZYME
      cd "$OCEANANIGANS_DIR"

      julia +$JULIA_VERSION_ENZYME -O0 --color=yes --project -e 'using Pkg; Pkg.test(julia_args=["--check-bounds=auto"])' # Remove --check-bounds=auto when https://github.com/EnzymeAD/Reactant.jl/issues/2347 is fixed
      # After we have instantiated the Enzyme environment, move manifest to the
      # version-specific filename, not to clash with the general manifest.
      # mv -v Manifest.toml Manifest-v$(echo "${JULIA_VERSION_ENZYME}" | cut -d. -f1-2).toml
    retry:
      automatic:
        - exit_status: 1
          limit: 1

  - label: "🦉 documentation"
    depends_on: "init"
    agents:
      queue: "Oceananigans-nautilus"
    env:
      CUDA_VISIBLE_DEVICES: "0" # GPU for docs
    command: |
      cd "$OCEANANIGANS_DIR"

      # On Nautilus we have old GPUs which require CUDA toolkit v12, can't
      # use v13.
      echo -e '[CUDA_Runtime_jll]\nversion = "12.9"' > docs/LocalPreferences.toml

      # `docs/Manifest.toml` is ignored and may persist in the agent checkout
      # across builds. Resolve the docs environment from `docs/Project.toml`.
      rm -f docs/Manifest.toml

      julia +$JULIA_VERSION --color=yes --project=docs/ -e \
        'using Pkg; Pkg.instantiate()'
      julia +$JULIA_VERSION --color=yes --project=docs/ docs/make.jl

      tar czf docs/docs-build.tar.gz docs/build
    artifact_paths:
      - "$OCEANANIGANS_DIR/docs/docs-build.tar.gz"

  - label: "{{ matrix.architecture }} - {{ matrix.group }} tests"
    key: "tests"
    depends_on: "init"
    agents:
      queue: "Oceananigans-nautilus"
    command: |
      # Add matrix-specific environment variables
      if [[ "{{ matrix.architecture }}" == "CPU" ]]; then
        export CUDA_VISIBLE_DEVICES="-1"
        export TEST_ARCHITECTURE="CPU"
      else
        export CUDA_VISIBLE_DEVICES="0"
        export TEST_ARCHITECTURE="GPU"
      fi

      # Strip emoji for environment variable
      group="{{ matrix.group }}"
      export TEST_GROUP="\${group#* }"
      echo "$$TEST_GROUP"

      cd "$OCEANANIGANS_DIR"

      # Coverage data is written next to the source files and picked up from
      # this directory by the Codecov step once all test jobs have finished.
      julia +$JULIA_VERSION -O0 --color=yes --project --code-coverage=user -e 'using Pkg; Pkg.test(coverage="user")'

    matrix:
      setup:
        architecture:
          - "CPU"
          - "GPU"
        group:
          - "🦖 poisson_solvers_2"
          - "🐇 unit"
          - "👻 abstract_operations"
          - "🕊 poisson_solvers_1"
          - "🦤 general_solvers"
          - "🎣 turbulence_closures"
          - "🏀 coriolis"
          - "🦀 time_stepping_1"
          - "🦈 time_stepping_2"
          - "🦟 time_stepping_3"
          - "🐫 nonhydrostatic_regression"
          - "🐙 hydrostatic_free_surface"
          - "🫐 tripolar_grid"
          - "🥑 vertical_coordinate_1"
          - "🍎 vertical_coordinate_2"
          - "🙈 hydrostatic_regression"
          - "🦢 shallow_water"
          - "🐳 simulation"
          - "🍂 lagrangian_particles"
          - "🧅 multi_region"
          - "🌐 multi_region_simulation"
          - "🌍 multi_region_simulation_immersed"
          - "🧵 conservative_regridding"
          - "🦧 scripts"

    retry:
      automatic:
        - exit_status: 1
          limit: 1

  - label: "{{ matrix.architecture }} - {{ matrix.group }} tests"
    key: "test_memory_allocation"
    depends_on: "init"
    agents:
      queue: "Oceananigans-nautilus"
    command: |
      # Add matrix-specific environment variables
      if [[ "{{ matrix.architecture }}" == "CPU" ]]; then
        export CUDA_VISIBLE_DEVICES="-1"
        export TEST_ARCHITECTURE="CPU"
      else
        export CUDA_VISIBLE_DEVICES="0"
        export TEST_ARCHITECTURE="GPU"
      fi

      # Strip emoji for environment variable
      group="{{ matrix.group }}"
      export TEST_GROUP="\${group#* }"
      echo "$$TEST_GROUP"

      cd "$OCEANANIGANS_DIR"

      # CodeCov increases allocations, we run without it to test memory allocations
      julia +$JULIA_VERSION --color=yes --project -e 'using Pkg; Pkg.test(julia_args=["--check-bounds=auto"])'

    matrix:
      setup:
        architecture:
          - "CPU"
          - "GPU"
        group:
          - "🧠 memory_allocation"

    retry:
      automatic:
        - exit_status: 1
          limit: 1

  - label: "{{ matrix.architecture }} - {{ matrix.group }} tests"
    key: "tests_enzyme_reactant"
    depends_on: "init_enzyme"
    agents:
      queue: "Oceananigans-nautilus"
    command: |
      # Add matrix-specific environment variables
      if [[ "{{ matrix.architecture }}" == "CPU" ]]; then
        export CUDA_VISIBLE_DEVICES="-1"
        export TEST_ARCHITECTURE="CPU"
      else
        export CUDA_VISIBLE_DEVICES="0"
        export TEST_ARCHITECTURE="GPU"
      fi

      # Strip emoji for environment variable
      group="{{ matrix.group }}"
      export TEST_GROUP="\${group#* }"
      echo "$$TEST_GROUP"

      cd "$OCEANANIGANS_DIR"

      # Disable code coverage until <https://github.com/EnzymeAD/Enzyme.jl/issues/3318#issue-4862069516> is resolved.
      julia +$JULIA_VERSION_ENZYME -O0 --color=yes --project --code-coverage=user -e 'using Pkg; Pkg.test(; coverage=false, julia_args=["--check-bounds=auto"])' # Remove --check-bounds=auto when https://github.com/EnzymeAD/Reactant.jl/issues/2347 is fixed

    matrix:
      setup:
        architecture:
          - "CPU"
          - "GPU"
        group:
          - "🎭 reactant_2"
          - "👺 enzyme"
          - "👹 reactant_1"
          - "🧪 reactant_correctness"

    retry:
      automatic:
        - exit_status: 1
          limit: 1

  #####
  ##### Blocking wait on tests and documentation
  #####

  - wait: ~
    continue_on_failure: true

  #####
  ##### Upload to Codecov
  #####

  - label: "📊 Upload coverage to Codecov"
    agents:
      queue: "Oceananigans-nautilus"
    command: |
      set -e

      # The test jobs ran with --code-coverage=user in this directory, which
      # writes the .cov files next to the source files. The directory is
      # specific to this build, so every .cov file in it belongs to this build.
      cd "$OCEANANIGANS_DIR"

      echo "Found .cov files:" $$(find src ext -name "*.cov" | wc -l)
      find src ext -name "*.cov" | head -n 20 || true

      if [ "$$(find src ext -name "*.cov" | wc -l)" -eq 0 ]; then
        echo "No coverage files were produced by the test steps."
        exit 0
      fi

      # Convert Julia .cov -> lcov.info (temp env so we don't edit Project/Manifest)
      julia --color=yes --project -e "import Pkg; Pkg.activate(; temp=true); Pkg.add(\"Coverage\"); using Coverage; cov = vcat(process_folder(\"src\"), process_folder(\"ext\")); LCOV.writefile(\"lcov.info\", cov)"

      echo "Generated lcov.info:"
      ls -lh lcov.info
      test -s lcov.info

      # Upload LCOV to Codecov
      curl -s https://codecov.io/bash | bash -s -- \
        -f lcov.info \
        -F buildkite \
        -F julia

  #####
  ##### Blocking wait on Codecov upload
  #####

  - wait: ~
    continue_on_failure: true

  #####
  ##### Clean up
  #####

  - label: "🧹 clean up environment"
    agents:
      queue: "Oceananigans-nautilus"
    commands:
      - "test -d $OCEANANIGANS_DIR && du -hs $OCEANANIGANS_DIR || true"
      - "test -d $OCEANANIGANS_DIR && rm -rf $OCEANANIGANS_DIR || true"
