env:
  JULIA_VERSION: "1.13.0"
  JULIA_VERSION_ENZYME: "1.13.0"
  BUILDKITE_HOME: "/var/lib/buildkite-agent"
  JULIA_DEPOT_PATH: "$BUILDKITE_HOME/.julia:"
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
  XLA_REACTANT_GPU_PREALLOCATE: false
  OCEANANIGANS_DIR: "$HOME/Oceananigans.jl-$BUILDKITE_BUILD_NUMBER"
  JULIA_CUDA_USE_COMPAT: false
agents:
  queue: "Oceananigans"
with:
  coverage: false

# Path groups for `if_changed`
paths:
  buildkite:     &buildkite_paths      ".buildkite/{pipeline.yml,hooks/**}"
  code:          &code_paths           "{ext,src}/**"
  project:       &project_paths        "Project.toml"
  tests:         &test_paths           "test/**"
  no_tests:      &no_test_paths        "test/{ProjectDistributed.toml,amdgpu/**,distributed/**,convergence/**,makie/**,manual/**,metal/**,mpi/**,oneapi/**,sharding/**}"
  docs:          &docs_paths           "{docs,examples}/**"
  agents:        &agents_paths         "AGENTS.md"

steps:
  - label: "🏕️ initialize general environment"
    concurrency_group: gate
    concurrency: 6
    key: "init"
    agents:
      queue: "Oceananigans-nautilus"
    env:
      TEST_GROUP: "init"
    timeout_in_minutes: 60
    if_changed:
      include: [*buildkite_paths, *code_paths, *project_paths, *test_paths, *docs_paths, *agents_paths]
      exclude: *no_test_paths
    command: |
      juliaup add $JULIA_VERSION

      mkdir -p "$OCEANANIGANS_DIR"
      rsync -a . "$OCEANANIGANS_DIR/"
      cd "$OCEANANIGANS_DIR"

      # On Nautilus we have old GPUs which require CUDA toolkit v12, can't
      # use v13.
      echo -e '[CUDA_Runtime_jll]\nversion = "12.9"' > test/LocalPreferences.toml

      julia +$JULIA_VERSION --color=yes --project=test --check-bounds=yes -e 'using Pkg; Pkg.instantiate()'
      # After we have instantiated the general environment, move manifest to the
      # version-specific filename, not to clash with the manifest for Enzyme.
      mv -v test/Manifest.toml test/Manifest-v$(echo "${JULIA_VERSION}" | cut -d. -f1-2).toml
    retry:
      automatic:
        - exit_status: 1
          limit: 1

  - label: "🔬 CPU - instrumented output writer tests"
    concurrency_group: gate
    concurrency: 6
    key: "instrumented_tests"
    depends_on: "init"
    agents:
      queue: "Oceananigans-nautilus"
    env:
      JULIA_CPU_THREADS: "6"
    timeout_in_minutes: 150
    command: "bash .buildkite/instrumented_writer_tests.sh"

  - wait: ~
    continue_on_failure: true

  #####
  ##### Clean up
  #####

  - label: "🧹 clean up environment"
    agents:
      queue: "Oceananigans-nautilus"
    commands:
      - "test -d $OCEANANIGANS_DIR && du -hs $OCEANANIGANS_DIR || true"
      - "test -d $OCEANANIGANS_DIR && rm -rf $OCEANANIGANS_DIR || true"
